:root{--bg:#fff;--on:#30d158;--off:#ff3b30;color-scheme:light;box-sizing:border-box;

*{box-sizing:border-box}

main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:4vh 3vw}

.scene.ready{visibility:visible}
.word{position:absolute;bottom:0;display:block;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}

.contact{position:absolute;border-radius:50%;filter:blur(2px);

.c1{left:-4%;width:42%;height:3.2%;bottom:-1.6%}

<script>
(function(){
  var scene=document.getElementById('scene'),man=document.getElementById('man'),
      L=document.getElementById('L'),R=document.getElementById('R'),
      Lt=document.getElementById('Lt'),Rt=document.getElementById('Rt');
  var WORDS={on:{l:'ONL',r:'NE',c:'#30d158',label:'Online'},off:{l:'OFFL',r:'NE',c:'#ff3b30',label:'Offline'}};
  var state=/offline/i.test(location.hash)?'off':'on';
  var cap=0.7, ref={};           // cap-height ratio; text widths at 100px
  var MAN=373/1300, GAP=.035;    // man width / height; gap beside him (x height)

  function measure(t,str){
    t.textContent=str; t.setAttribute('font-size',100);
    return t.getComputedTextLength();
  }
  function calibrate(){
    var c=document.createElement('canvas').getContext('2d');
    c.font='100px LG, "Arial Narrow", Impact, sans-serif';
    var m=c.measureText('E'); if(m.actualBoundingBoxAscent) cap=m.actualBoundingBoxAscent/100;
    L.style.visibility=R.style.visibility='hidden';
    ['on','off'].forEach(function(k){
      ref[k]={l:measure(Lt,WORDS[k].l),r:measure(Rt,WORDS[k].r)};
    });
    L.style.visibility=R.style.visibility='';
  }
  function layout(){
    var W=scene.clientWidth, vh=window.innerHeight;
    // both words share ONE font size: the longer word (OFFLINE) decides it
    var em=Math.max(ref.on.l+ref.on.r, ref.off.l+ref.off.r)/100;
    var H=Math.min(vh*.7, 760, W/(em/cap + MAN + 2*GAP));
    var fs=H/cap, w=WORDS[state], tws=[];
    scene.style.height=H+'px';
    man.style.height=H+'px'; man.style.width=(H*MAN)+'px';
    [[L,Lt,w.l],[R,Rt,w.r]].forEach(function(a){
      var svg=a[0],t=a[1];
      t.textContent=a[2]; t.setAttribute('font-size',fs); t.setAttribute('y',H); t.setAttribute('x',0);
      var tw=t.getComputedTextLength(); tws.push(tw);
      svg.setAttribute('width',tw); svg.setAttribute('height',H); svg.style.setProperty('--c',w.c);
    });
    // centre the whole word (letters + man) on the page
    var total=tws[0]+tws[1]+H*MAN+2*H*GAP, x0=(W-total)/2;
    L.style.left=x0+'px';
    man.style.left=(x0+tws[0]+H*GAP)+'px';
    R.style.left=(x0+tws[0]+H*GAP+H*MAN+H*GAP)+'px';
    scene.setAttribute('aria-label',w.label);
    document.title='Bush API \u2013 '+w.label;
  }
  var live=false, ready=false, checked=false;
  function reveal(){ if(ready&&checked) scene.classList.add('ready'); }
  function toggle(){ if(live) return; state=state==='on'?'off':'on'; layout(); }
  [L,R].forEach(function(s){s.addEventListener('click',toggle)});
  window.addEventListener('resize',function(){ if(ready) layout(); });
  window.addEventListener('hashchange',function(){ if(!live){ state=/offline/i.test(location.hash)?'off':'on'; layout(); }});

  /* Live status: is the API reachable? Works when the page runs where it may call the API
     (e.g. hosted on your own site). Where the host blocks outside requests, it falls back to a
     manual ONLINE/OFFLINE page and stops checking. */
  var URL_='https://pull.bush.downingtownstem.org', blocked=false;
  document.addEventListener('securitypolicyviolation',function(){ blocked=true; checked=true; reveal(); });
  function setLive(up){ live=true; state=up?'on':'off'; checked=true; if(ready){layout();} reveal(); }
  function ping(){
    if(blocked||!window.fetch) { checked=true; reveal(); return; }
    var ctl=window.AbortController?new AbortController():null, timer=setTimeout(function(){ if(ctl) ctl.abort(); },6000);
    fetch(URL_,{mode:'no-cors',cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(){ clearTimeout(timer); if(!blocked) setLive(true); })
      .catch(function(){ clearTimeout(timer); if(!blocked) setLive(false); else { checked=true; reveal(); } });
  }
  ping(); setInterval(function(){ if(!blocked) ping(); },30000);
  setTimeout(function(){ checked=true; reveal(); },7000);

  var go=function(){ calibrate(); layout(); ready=true; reveal(); };
  var done=false,once=function(){ if(!done){ done=true; go(); } };
  if(document.fonts&&document.fonts.load){
    document.fonts.load('100px LG','ONLFE').then(once,once); setTimeout(once,1500);
  }else once();
})();
</script>
